### Windows-friendly Veri776 config.
### EDIT ONLY THE PATHS IN THE "##DATA" SECTION BELOW, then run:
###   python main.py --model_arch Baseline --config ./config/config_Veri776_windows.yaml
### Use forward slashes "/" in paths (they work on Windows and avoid YAML backslash escaping).


model_arch: Baseline
LAI: False
n_cams: 20
n_views: 8
backbone: ibn #-D
torch_seed: 0 #0 # 3407
epoch_freeze_L1toL3: 0
freeze_triplet_branches: 0
freeze_backbone_warmup: False  ## for circle
branch_layer: 3
validation_period: 10


###GPU Settings
half_precision: True   ## Veri776 baseline runs full precision
parallel: False
gpu: 0


####LOSSES
mean_losses: False


softmax_loss: torch_ce
label_smoothing: 0.1


metric_loss: fastreidtriplet #Batch_hard_triplet #Batch_hard_triplet #SupCon #RLL
metric_loss_trans: fastreidtriplet
hard_mining: True
triplet_norm: False
triplet_margin: 0.1 # None for Soft Margin Triplet Loss with Batch Hard
triplet_margin_trans: 0.1




circle_softmax: False
margin_circle: 0.35
scale_circle: 64






group_norm: False
pretrain_gropnorm: False
gn_init: kaiming
pretrain_ongroups: True




#
##DATA  Paths are relative to the repo root (run main.py from the project folder).
##       Dataset lives in ./dataset/VeRi/ containing image_train/ image_query/
##       image_test/ and the name_*.txt list files.
ROOT_DIR: ./dataset/VeRi/
BATCH_SIZE: 48 #48  (must be divisible by NUM_INSTANCES)
NUM_INSTANCES: 8 #8
num_workers_train: 4   ## lower than the paper's 8; safer on Windows
num_workers_teste: 4   ## set to 0 if you hit DataLoader worker errors on Windows


y_length: 256
x_length: 256


n_mean: [0.5, 0.5, 0.5]
n_std: [0.5, 0.5, 0.5]


p_hflip: 0.5
p_rerase: 0.5


####VERIWILD 3067306711 Veri776 770 Market 1501
dataset: Veri776 #Veri776


n_classes: 575 #30671 #770  (Veri776 training set = 575 identities; must match your train list)
query_dir: ./dataset/VeRi/image_query/
teste_dir: ./dataset/VeRi/image_test/
train_dir: ./dataset/VeRi/image_train/
query_list_file: ./dataset/VeRi/name_query.txt
gallery_list_file: ./dataset/VeRi/name_test.txt
train_list_file: ./dataset/VeRi/name_train.txt


test_keypoint: ./dataset/VeRi/keypoint_orient_test.txt
train_keypoint: ./dataset/VeRi/keypoint_orient_train.txt


### Define an optimizer settings
optimizer: Adam #Adam SGD
lr: 0.0001 #3.5e-5 original Adam 0.0001
weight_decay:  0.0005
bias_lr_factor: 1
momentum: 0.9


###scheduler settings
sched_name: Warm_MultiStep
min_lr: 7.75e-5
num_epochs: 120
milestones: [40, 70, 100]
gamma: 0.1
warmup_factor: 0.0
warmup_iters: 10
warmup_method: linear




alpha_ce: 0.6 #aka alpha
beta_tri: 1.0  #aka beta
gamma_ce: 0.4
gamma_t: 0.4




#####Experiment
pool: GAP   ###GeM    HMP   GAP
pool_tripletb: GAP
pool_trans: GAP
linear_num: False #1024 #False or value



